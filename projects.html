<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HH Project Manager">
  <meta name="theme-color" content="#E8521A">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/ic_launcher-playstore.png">
  <title>Handy Helper — Project Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #1A1612;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* Top bar with back link — visible only in browser, hidden when installed as PWA */
    #topbar {
      display: none;
      height: 44px;
      background: #1A1612;
      border-bottom: 1px solid rgba(232,82,26,0.2);
      align-items: center;
      padding: 0 1rem;
      gap: 1rem;
      flex-shrink: 0;
    }
    #topbar a {
      color: #8A7E76;
      text-decoration: none;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    #topbar a:hover { color: #F5F0E8; }
    #topbar .brand {
      font-size: 14px;
      font-weight: 700;
      color: #F5F0E8;
      flex: 1;
    }
    #topbar .brand span { color: #E8521A; }

    #wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
      display: block;
      background: #1A1612;
    }

    /* iOS install banner — shown in Safari only, hidden when standalone */
    #install-banner {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #2C2520;
      border-top: 2px solid #E8521A;
      padding: 12px 16px 20px;
      text-align: center;
      z-index: 9999;
      font-family: sans-serif;
    }
    #install-banner p { font-size: 13px; color: #F5F0E8; line-height: 1.5; margin-bottom: 6px; }
    #install-banner span { color: #E8521A; font-weight: 600; }
    #install-banner button {
      background: transparent; border: none; color: #8A7E76;
      font-size: 12px; padding: 4px 8px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="wrapper">
    <!-- Top bar — shown in regular browser so user can navigate back to the site -->
    <div id="topbar">
      <a href="/">← handyhelper.company</a>
      <div class="brand">Handy<span>Helper</span> — Project Manager</div>
      <a href="/#chat">AI Assistant</a>
    </div>

    <!-- Project Manager Streamlit app embedded full screen -->
    <!-- REPLACE THE URL BELOW WITH YOUR ACTUAL PROJECT MANAGER STREAMLIT URL -->
    <iframe
      id="pm-frame"
      src="https://handy-apper-projects-ydshcuvzcxmsqs8ygkhvxi.streamlit.app/?embedded=true"
      allow="camera; microphone"
      allowfullscreen
      loading="eager"
    ></iframe>
  </div>

  <!-- iOS install banner -->
  <div id="install-banner">
    <p>📲 Tap <span>Share ↑</span> then <span>"Add to Home Screen"</span> to install the Project Manager as a free app.</p>
    <button onclick="document.getElementById('install-banner').style.display='none'">Dismiss</button>
  </div>

  <script>
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    var isStandalone = window.navigator.standalone === true;

    // Show the top nav bar in regular browser (not when installed as PWA)
    if (!isStandalone) {
      document.getElementById('topbar').style.display = 'flex';
    }

    // Show iOS install banner when in Safari (not already installed)
    if (isIOS && !isStandalone) {
      var banner = document.getElementById('install-banner');
      banner.style.display = 'block';
      // Shrink iframe to make room for banner
      document.getElementById('pm-frame').style.marginBottom = '90px';
    }
  </script>

</body>
</html>
