<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Handy Helper">
  <meta name="theme-color" content="#E8521A">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/ic_launcher-playstore.png">
  <title>Handy Helper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1A1612;
    }
    /* Banner shown in Safari browser only (not when already installed as PWA) */
    #install-banner {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #2C2520;
      border-top: 2px solid #E8521A;
      padding: 12px 16px 20px;
      text-align: center;
      z-index: 9999;
      font-family: sans-serif;
    }
    #install-banner p {
      font-size: 13px;
      color: #F5F0E8;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    #install-banner span { color: #E8521A; font-weight: 600; }
    #install-banner button {
      background: transparent;
      border: none;
      color: #8A7E76;
      font-size: 12px;
      padding: 4px 8px;
      cursor: pointer;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #1A1612;
    }
  </style>
</head>
<body>

  <!-- Only visible in Safari browser, hidden once installed as PWA -->
  <div id="install-banner">
    <p>📲 Tap <span>Share ↑</span> then <span>"Add to Home Screen"</span> to install Handy Helper as a free app on your iPhone.</p>
    <button onclick="document.getElementById('install-banner').style.display='none'">Dismiss</button>
  </div>

  <iframe
    src="https://alex-diy-chatbot-z679bpxd5bhtwg8fpncf2u.streamlit.app/?embedded=true"
    allow="camera; microphone"
    allowfullscreen
    loading="eager"
  ></iframe>

  <script>
    // Show the install banner ONLY in Safari on iOS (not when already installed as PWA)
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    var isStandalone = window.navigator.standalone === true;
    if (isIOS && !isStandalone) {
      document.getElementById('install-banner').style.display = 'block';
      // Make room for the banner by shrinking the iframe
      document.querySelector('iframe').style.height = 'calc(100% - 100px)';
    }
  </script>

</body>
</html>
